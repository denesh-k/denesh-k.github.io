<style>
:root{
  --maroon:#7A0019; --maroon-deep:#5B0013; --gold:#FFCC33; --gold-soft:#F6E3A8;
  --bg:#FAF6EE; --card:#FFFFFF; --ink:#24191B; --muted:#6B5E60; --line:#E9E0D2;
  --chip:#F3ECDD; --accent:var(--maroon); --on-accent:#FFFFFF;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17110F; --card:#221A18; --ink:#F4ECE2; --muted:#B9AAA2; --line:#3A2D2A;
    --chip:#2E2320; --accent:#FFCC33; --on-accent:#2A0008;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);
  padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Header */
.hero{background:linear-gradient(160deg,var(--maroon) 0%,var(--maroon-deep) 100%);color:#fff;
  padding:calc(36px + env(safe-area-inset-top)) 0 76px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--gold)}
.hero .wrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;border:4px solid var(--gold);
  background:#fff1;display:grid;place-items:center;overflow:hidden;
  font:600 40px/1 var(--serif);color:var(--gold);letter-spacing:.02em}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font:600 clamp(28px,7.5vw,38px)/1.15 var(--serif);margin:18px 0 6px;letter-spacing:-.01em}
.role{margin:0;font-weight:600;color:var(--gold-soft)}
.aff{margin:6px 0 0;color:#F3DADF;font-size:15px;max-width:30em}
.aff a{color:#fff;text-decoration-color:var(--gold);text-underline-offset:3px}

/* Action buttons */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-50px;position:relative;z-index:1}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:12px 14px;
  border-radius:14px;font:600 16px/1.2 var(--sans);text-decoration:none;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  box-shadow:0 6px 18px rgba(60,10,20,.10);-webkit-tap-highlight-color:transparent;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px;flex:none}
.btn.primary{grid-column:1/-1;background:var(--gold);color:var(--maroon-deep);border-color:transparent;
  box-shadow:0 8px 22px rgba(60,10,20,.25)}
.btn.linkedin svg{color:#0A66C2}
.btn.save svg{color:var(--maroon)}
@media (prefers-color-scheme: dark){ .btn.save svg{color:var(--gold)} .btn.linkedin svg{color:#5AA9FF} }
.actions .btn:last-child:nth-child(even){grid-column:1/-1}

/* Sections */
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-top:16px}
h2{font:600 21px/1.2 var(--serif);margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--gold)}
.bio{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.chips li{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}

.pubs{list-style:none;margin:0;padding:0}
.pub{padding:14px 0;border-top:1px solid var(--line)}
.pub:first-child{border-top:0;padding-top:2px}
.pub-meta{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-size:13px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px}
.pub-title{font:600 17px/1.35 var(--serif);margin:0 0 4px}
.pub-title a{text-decoration:none}
.pub-title a:hover{text-decoration:underline}
.pub p{margin:0;font-size:14.5px;color:var(--muted)}
.pub b{color:var(--ink)}
.pub .venue{font-style:italic}
.pub-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;font-weight:600;
  color:var(--accent);text-decoration:none;min-height:32px}

.linklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.linklist a{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:12px;
  background:var(--chip);text-decoration:none;font-weight:600}
.linklist a span{color:var(--muted);font-weight:400}

footer{text-align:center;color:var(--muted);font-size:13px;padding:26px 16px 34px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>

<header class="hero">
  <div class="wrap">
    <div class="avatar" id="avatar" aria-hidden="true">DK</div>
    <h1 id="name">Denesh Karunakaran</h1>
    <p class="role" id="role"></p>
    <p class="aff" id="aff"></p>
  </div>
</header>

<main class="wrap">
  <nav class="actions" id="actions" aria-label="Contact">
    <a class="btn primary" href="mailto:kdene001@umn.edu" id="emailBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <span>Email me</span>
    </a>
  </nav>
  <noscript><p style="text-align:center">Email: <a href="mailto:kdene001@umn.edu">kdene001@umn.edu</a></p></noscript>

  <section id="about" aria-labelledby="about-h">
    <h2 id="about-h">About</h2>
    <p class="bio" id="bio"></p>
    <ul class="chips" id="interests" aria-label="Research interests"></ul>

    <ol class="pubs" id="pubs"></ol>
  </section>

    <ul class="linklist" id="linklist"></ul>
  </section>
</main>

<footer id="footer"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const P = PROFILE, $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const icons = {
    linkedin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.95v5.66H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>',
    save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M19 8v6M16 11h6"/></svg>',
    doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',
    out:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>'
  };

  // Header
  document.title = P.fullName + " · " + P.university;
  $("name").textContent = P.fullName;
  $("role").textContent = P.titles.join(" · ");
  $("aff").innerHTML = [esc(P.department),
    P.lab ? (P.labUrl ? `<a href="${esc(P.labUrl)}">${esc(P.lab)}</a>` : esc(P.lab)) : "",
    esc(P.university)].filter(Boolean).join("<br>");
  const initials = (P.firstName[0] || "") + (P.lastName[0] || "");
  if (P.photo) $("avatar").innerHTML = `<img src="${esc(P.photo)}" alt="">`;
  else $("avatar").textContent = initials;

  // Buttons
  const a = $("actions");
  $("emailBtn").href = "mailto:" + P.email;
  const add = html => a.insertAdjacentHTML("beforeend", html);
  if (P.linkedin) add(`<a class="btn linkedin" href="${esc(P.linkedin)}" target="_blank" rel="noopener">${icons.linkedin}<span>LinkedIn</span></a>`);
  add(`<button class="btn save" id="saveBtn" type="button">${icons.save}<span>Save contact</span></button>`);
  if (P.cvPdf) add(`<a class="btn" href="${esc(P.cvPdf)}" target="_blank">${icons.doc}<span>CV</span></a>`);
  if (P.posterPdf) add(`<a class="btn" href="${esc(P.posterPdf)}" target="_blank">${icons.doc}<span>Poster</span></a>`);

  // About
  $("bio").textContent = P.bio;
  $("interests").innerHTML = P.interests.map(i => `<li>${esc(i)}</li>`).join("");

  // Publications
  if (!P.publications.length) $("publications").hidden = true;
  $("pubs").innerHTML = P.publications.map(p => {
    const authors = esc(p.authors).replace(P.authorMatch, m => `<b>${m}</b>`);
    const title = p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title);
    const linkLabel = /doi\.org/.test(p.link) ? "DOI" : "Read";
    return `<li class="pub">
      <div class="pub-meta"><span>${esc(p.year)}</span>${p.type ? `<span class="tag">${esc(p.type)}</span>` : ""}</div>
      <h3 class="pub-title">${title}</h3>
      <p>${authors}</p>
      <p class="venue">${esc(p.venue)}</p>
      ${p.link ? `<a class="pub-link" href="${esc(p.link)}" target="_blank" rel="noopener">${linkLabel} ${icons.out}</a>` : ""}
    </li>`;
  }).join("");

  // Links
  if (!P.links.length) $("links").hidden = true;
  $("linklist").innerHTML = P.links.map(l =>
    `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} <span>${icons.out}</span></a></li>`).join("");

  $("footer").innerHTML = `© ${new Date().getFullYear()} ${esc(P.fullName)} · Updated ${esc(P.lastUpdated)}`;

  // Save contact (vCard) — built from the content above, so it never goes out of date
  const v = s => String(s).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1");
  function vcard(){
    const site = location.protocol.startsWith("http") ? location.origin + location.pathname.replace(/index\.html$/,"") : "";
    const lines = ["BEGIN:VCARD","VERSION:3.0",
      `N:${v(P.lastName)};${v(P.firstName)};;;`, `FN:${v(P.fullName)}`,
      `ORG:${v(P.university)};${v(P.department)}`, `TITLE:${v(P.titles.join(", "))}`,
      `EMAIL;TYPE=INTERNET,WORK:${P.email}`];
    if (P.phone) lines.push(`TEL;TYPE=CELL:${P.phone}`);
    if (P.office) lines.push(`ADR;TYPE=WORK:;;${v(P.office)};;;;`);
    if (site) lines.push(`URL:${site}`);
    if (P.linkedin) lines.push(`URL;TYPE=LinkedIn:${P.linkedin}`);
    lines.push(`NOTE:${v(P.lab)}`, "END:VCARD");
    return lines.join("\r\n");
  }
  $("saveBtn").addEventListener("click", () => {
    const blob = new Blob([vcard()], {type:"text/vcard;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = P.fullName.replace(/\s+/g,"_") + ".vcf";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    const t = $("toast"); t.textContent = "Contact card downloaded — open it to add to your contacts";
    t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 3500);
  });
})();
</script>
</body>
</html>
